services:
  - type: web
    name: shucom-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAIL_TO
        sync: false
      - key: CORS_ORIGINS
        value: https://shibu-patil.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: RESEND_API_KEY
        sync: false
